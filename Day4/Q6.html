```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving Bike Animation</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .scene {
            height: 100vh;
            width: 100%;
            position: relative;
            overflow: hidden;
            background: linear-gradient(
                skyblue 0%,
                #87ceeb 55%,
                #65b84e 55%,
                #287a32 100%
            );
        }

        .sun {
            position: absolute;
            top: 50px;
            right: 100px;
            width: 90px;
            height: 90px;
            background: #ffeb70;
            border-radius: 50%;
            box-shadow: 0 0 45px #fff4a3;
        }

        .cloud {
            position: absolute;
            top: 100px;
            left: 100%;
            font-size: 60px;
            color: white;
            animation: clouds 18s linear infinite;
        }

        @keyframes clouds {
            from { left: 100%; }
            to { left: -200px; }
        }

        .road {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 35%;
            background: #353535;
            border-top: 8px solid #777;
        }

        .road::before {
            content: "";
            position: absolute;
            top: 50%;
            width: 200%;
            height: 8px;
            background: repeating-linear-gradient(
                to right,
                white 0 80px,
                transparent 80px 160px
            );
            animation: roadMove 0.7s linear infinite;
        }

        @keyframes roadMove {
            from { transform: translateX(0); }
            to { transform: translateX(-160px); }
        }

        .bike {
            position: absolute;
            bottom: 22%;
            left: 10%;
            width: 300px;
            height: 190px;
            animation: bikeBounce 0.3s ease-in-out infinite alternate;
        }

        @keyframes bikeBounce {
            from { transform: translateY(0); }
            to { transform: translateY(-3px); }
        }

        .wheel {
            position: absolute;
            bottom: 0;
            width: 85px;
            height: 85px;
            border: 9px solid #111;
            outline: 4px solid #aaa;
            border-radius: 50%;
            background: repeating-conic-gradient(
                #ddd 0deg 10deg,
                #444 10deg 20deg
            );
            animation: rotate 0.35s linear infinite;
        }

        .wheel::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            background: #777;
            border: 4px solid #111;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        .front {
            right: 0;
        }

        .back {
            left: 0;
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        .body-bike {
            position: absolute;
            left: 48px;
            bottom: 60px;
            width: 200px;
            height: 55px;
            background: #ed1515;
            border: 4px solid #111;
            border-radius: 50% 15% 30% 20%;
            transform: skew(-15deg);
        }

        .seat {
            position: absolute;
            left: 70px;
            bottom: 118px;
            width: 80px;
            height: 14px;
            background: #111;
            border-radius: 15px;
            transform: rotate(-5deg);
        }

        .handle {
            position: absolute;
            right: 12px;
            bottom: 120px;
            width: 45px;
            height: 8px;
            background: #111;
            transform: rotate(-45deg);
        }

        .rider {
            position: absolute;
            left: 105px;
            bottom: 125px;
            width: 45px;
            height: 65px;
            background: #222;
            border-radius: 20px;
            transform: rotate(-30deg);
        }

        .helmet {
            position: absolute;
            left: 115px;
            bottom: 177px;
            width: 42px;
            height: 38px;
            background: #111;
            border: 4px solid red;
            border-radius: 50% 50% 35% 35%;
        }

        h1 {
            position: absolute;
            top: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            text-shadow: 2px 3px 5px #333;
        }
    </style>
</head>

<body>
    <div class="scene">
        <div class="sun"></div>
        <div class="cloud">☁️</div>

        <h1>🏍️ Moving Bike Animation</h1>

        <div class="bike">
            <div class="wheel back"></div>
            <div class="wheel front"></div>

            <div class="body-bike"></div>
            <div class="seat"></div>
            <div class="handle"></div>
            <div class="rider"></div>
            <div class="helmet"></div>
        </div>

        <div class="road"></div>
    </div>
</body>
</html>
