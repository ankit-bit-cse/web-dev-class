<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <style>

        #heading {
            color: blue;
            text-align: center;
        }

        #para1 {
            color: red;
            font-size: 20px;
        }

        #para2 {
            color: green;
            font-size: 20px;
        }

    </style>

</head>

<body>

    <h1 id="heading">
        Multiple ID Selectors
    </h1>

    <p id="para1">
        This paragraph is styled using ID selector 1.
    </p>

    <p id="para2">
        This paragraph is styled using ID selector 2.
    </p>

</body>

</html>
