<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <style>

        .red {
            color: red;
        }

        .large {
            font-size: 25px;
        }

        .box {
            background-color: yellow;
            padding: 10px;
            margin: 10px;
        }

    </style>

</head>

<body>

    <h1 class="red large">
        Multiple Class Selectors
    </h1>

    <p class="red">
        This is the first paragraph.
    </p>

    <p class="red">
        This is the second paragraph.
    </p>

    <div class="box">
        This is a box using the class selector.
    </div>

</body>

</html>
