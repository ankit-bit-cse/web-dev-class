```html
<!DOCTYPE html>
<html>
<head>
    <title>Moving Rectangle</title>

    <style>
        .box {
            width: 250px;
            height: 100px;
            background-color: blue;
            position: relative;
            animation: move 4s infinite alternate;
        }

        @keyframes move {
            from {
                left: 0px;
            }

            to {
                left: 600px;
            }
        }
    </style>
</head>

<body>

    <div class="box"></div>

</body>
</html>
```
