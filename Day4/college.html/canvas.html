<!DOCTYPE html>
<html>

<head>
    <title>HTML Canvas</title>
</head>

<body>

    <h2>Canvas Graphics</h2>

    <canvas id="myCanvas"
            width="400"
            height="200"
            style="border: 1px solid black;">
    </canvas>

    <script>

        // Get Canvas and 2D drawing context
        var canvas = document.getElementById("myCanvas");
        var ctx = canvas.getContext("2d");


        // 1. fillRect()
        ctx.fillStyle = "blue";
        ctx.fillRect(30, 30, 120, 70);


        // 2. strokeRect()
        ctx.strokeStyle = "red";
        ctx.lineWidth = 4;
        ctx.strokeRect(200, 30, 120, 70);


        // 3. clearRect()
        // Erases a small part of the blue rectangle
        ctx.clearRect(70, 50, 40, 30);


        // 4. beginPath()
        ctx.beginPath();


        // 5. moveTo()
        ctx.moveTo(50, 150);


        // 6. lineTo()
        ctx.lineTo(250, 150);

        ctx.strokeStyle = "green";
        ctx.lineWidth = 5;
        ctx.stroke();


        // 7. arc()
        ctx.beginPath();

        ctx.arc(
            350,
            180,
            60,
            0,
            2 * Math.PI
        );


        // 8. fill()
        ctx.fillStyle = "orange";
        ctx.fill();


        // Draw circle outline
        ctx.strokeStyle = "black";
        ctx.stroke();

    </script>

</body>

</html>
