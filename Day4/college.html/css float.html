<!DOCTYPE html>
<html>
<head>

        .box {
            width: 150px;
            height: 100px;
            background-color: lightblue;
            float: left;
            margin: 10px;
        }

</head>

<body>

    <div class="box">Box 1</div>
    <div class="box">Box 2</div>

    <p>
        This is a paragraph. The text can flow around
        the floated boxes.
    </p>

</body>
</html>
