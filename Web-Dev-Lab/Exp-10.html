
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Data Types</title>
</head>
<body>
<script>
    let name = "Ram";
    let age = 25;
    let isTeacher = true;
    let address;
    let salary = null;

    let student = {
        name: "Rahul",
        age: 20
    };

    let subjects = ["HTML", "CSS", "JavaScript"];

    document.write("Name: " + name + "<br>");
    document.write("Age: " + age + "<br>");
    document.write("Teacher: " + isTeacher + "<br>");
    document.write("Address: " + address + "<br>");
    document.write("Salary: " + salary + "<br>");
    document.write("Student Name: " + student.name + "<br>");
    document.write("Subjects: " + subjects);
</script>
</body>
</html>
