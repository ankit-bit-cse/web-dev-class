<!DOCTYPE html>
<html>

    <head>

        <title> Design a YouTube-style Video Card</title> 

        <style>

            .video-card {
                width: 300px;
                padding: 20px;
                margin: 20px;
                border: 2px solid black;
                box-sizing: border-box;
            }

           .video-card img {
    width: 100%;
}

      .video-card .price {
                color: red;

            }

            
        </style>
    </head>
    

    

    <body>

        <div class="video-card">

            <img src="https://codebegun.graphy.com/s/store/courses/677df278803a7e675770d85f/cover.jpg?v=1.jpg" alt="java couse">

            <h2>Learn java in 30 days</h2>

            <p>Beginner friendly course for learning java.</p>

            <p class="price">₹499</p>

            <button>Watch Now</button>

        </div>

        

    </body>
        

    

    
</html>
